name: CI

# 校验包结构、本地 ZIP 复制安装及脚本语法；GitHub 探活受用户网络影响，
# 实际 DSH 启动还需在目标版本真机验证。检查逻辑在 scripts/check-package.mjs。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'RELEASE.md'
      - 'CHANGELOG.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 打包自检 (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查（宿主与浏览器半区）
        shell: bash
        run: |
          for file in index.js host-config.js host-sensors.js win-native.js client.js install.mjs; do
            node --check "$file"
            echo "ok  $file"
          done

      - name: 配置契约对拍（host-config.js ↔ client.js 内联副本）
        run: node scripts/check-config-contract.mjs

      - name: 发布自检
        run: node scripts/check-package.mjs
